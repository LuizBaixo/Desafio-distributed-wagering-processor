name: wagering-dev

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wagering
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./infra/postgres/init-roles.sql:/docker-entrypoint-initdb.d/01-init-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wagering"]
      interval: 2s
      timeout: 3s
      retries: 30

  ministack:
    image: ministackorg/ministack:1.5.35
    ports:
      - "${SQS_PORT:-4566}:4566"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4566/_ministack/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30

  sqs-init:
    image: amazon/aws-cli:2.17.0
    entrypoint: ["/bin/sh", "/init/init-sqs.sh"]
    environment:
      SQS_ENDPOINT: http://ministack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./infra/ministack:/init:ro
    depends_on:
      ministack:
        condition: service_healthy
    restart: "no"

  # Roda as migrations como dono do schema (wagering_owner), uma vez, antes da aplicação.
  migrate:
    build: .
    command: ["bun", "run", "migration:up"]
    environment:
      MIGRATION_DATABASE_URL: postgres://wagering_owner:owner@postgres:5432/wagering
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Escalar com: docker compose up -d --build --scale app=3 (portas do host em APP_PORTS, padrão 3001-3003).
  app:
    build: .
    environment:
      PORT: "3000"
      APP_ROLES: api,consumer,outbox,pending
      DATABASE_URL: postgres://wagering_app:app@postgres:5432/wagering
      SQS_ENDPOINT: http://ministack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    ports:
      - "${APP_PORTS:-3001-3003}:3000"
    # SIGTERM -> espera até 40s -> SIGKILL. Ver ARCHITECTURE.md §12 (Shutdown).
    stop_grace_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      ministack:
        condition: service_healthy
      sqs-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
