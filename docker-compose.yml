name: wagering-dev

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: postgres
      # somente desenvolvimento local: defina no .env para trocar o default
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: wagering
      # lidas por infra/postgres/init-roles.sql (somente desenvolvimento local)
      WAGERING_OWNER_PASSWORD: ${WAGERING_OWNER_PASSWORD:-owner}
      WAGERING_APP_PASSWORD: ${WAGERING_APP_PASSWORD:-app}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./infra/postgres/init-roles.sql:/docker-entrypoint-initdb.d/01-init-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wagering"]
      interval: 2s
      timeout: 3s
      retries: 30

  ministack:
    image: ministackorg/ministack:1.5.35
    ports:
      - "127.0.0.1:${SQS_PORT:-4566}:4566"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4566/_ministack/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30

  sqs-init:
    image: amazon/aws-cli:2.17.0
    entrypoint: ["/bin/sh", "/init/init-sqs.sh"]
    environment:
      SQS_ENDPOINT: http://ministack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./infra/ministack:/init:ro
    depends_on:
      ministack:
        condition: service_healthy
    restart: "no"

  # Roda as migrations como dono do schema (wagering_owner), uma vez, antes da aplicação.
  migrate:
    build: .
    command: ["bun", "run", "migration:up"]
    environment:
      # desenvolvimento local: sem isto, a imagem roda como production (ver Dockerfile)
      NODE_ENV: development
      AUTH_MODE: disabled
      # somente desenvolvimento local (default da senha)
      MIGRATION_DATABASE_URL: postgres://wagering_owner:${WAGERING_OWNER_PASSWORD:-owner}@postgres:5432/wagering
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Escalar com: docker compose up -d --build --scale app=3 (portas do host em APP_PORTS, padrão 3001-3003).
  app:
    build: .
    environment:
      PORT: "3000"
      # desenvolvimento local: sem isto, a imagem roda como production (ver Dockerfile)
      NODE_ENV: development
      # desenvolvimento local: sem auth (produção exige AUTH_MODE explícito)
      AUTH_MODE: disabled
      APP_ROLES: api,consumer,outbox,pending
      # somente desenvolvimento local (default da senha)
      DATABASE_URL: postgres://wagering_app:${WAGERING_APP_PASSWORD:-app}@postgres:5432/wagering
      SQS_ENDPOINT: http://ministack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      # Tracing opcional. Vazio: desligado. Com o profile observability: http://jaeger:4318
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: wagering-processor
    ports:
      - "127.0.0.1:${APP_PORTS:-3001-3003}:3000"
    # SIGTERM -> espera até 40s -> SIGKILL. Ver ARCHITECTURE.md §12 (Shutdown).
    stop_grace_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      ministack:
        condition: service_healthy
      sqs-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully

  # Observabilidade opcional: docker compose --profile observability up -d --build --scale app=3
  # Prometheus raspa as réplicas de `app` (dns_sd). Grafana vem com datasource e dashboard provisionados.
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [observability]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      app:
        condition: service_started

  # Traces (OTLP HTTP em 4318, UI em 16686). Ligue o tracing do app com OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318.
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    profiles: [observability]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:${JAEGER_PORT:-16686}:16686"

  grafana:
    image: grafana/grafana:12.1.0
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # somente desenvolvimento local: defina GRAFANA_ADMIN_PASSWORD no .env para trocar o default
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # acesso anônimo só como Viewer, somente no profile observability (porta em 127.0.0.1)
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started
