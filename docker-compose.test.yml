name: wagering-test

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wagering
      # credenciais fracas aceitas só nos testes (ambiente efêmero, porta em 127.0.0.1)
      WAGERING_OWNER_PASSWORD: owner
      WAGERING_APP_PASSWORD: app
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ./infra/postgres/init-roles.sql:/docker-entrypoint-initdb.d/01-init-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wagering"]
      interval: 2s
      timeout: 3s
      retries: 30

  ministack:
    image: ministackorg/ministack:1.5.35
    ports:
      - "127.0.0.1:4567:4566"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4566/_ministack/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30

  sqs-init:
    image: amazon/aws-cli:2.17.0
    entrypoint: ["/bin/sh", "/init/init-sqs.sh"]
    environment:
      SQS_ENDPOINT: http://ministack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./infra/ministack:/init:ro
    depends_on:
      ministack:
        condition: service_healthy
    restart: "no"
